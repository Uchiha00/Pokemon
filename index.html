<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Tracker: Eeveelution Edition</title>
    <style>
        :root {
            --bg-dark: #050505;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow-x: auto; overflow-y: hidden;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
        }

        /* --- ТРЕК З ІГРАМИ --- */
        .track-container {
            display: flex; align-items: center; gap: 30px;
            padding: 40px 60px; min-width: max-content; margin: 0 auto;
        }

        .vertical-divider {
            width: 1px; height: 140px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.3), transparent);
            margin: 0 10px;
        }

        /* --- КАПСУЛИ (LIQUID GLASS) --- */
        .capsule-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            cursor: pointer; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .capsule-wrapper:hover { transform: scale(1.08) translateY(-10px); }

        /* САМА КАПСУЛА */
        .capsule {
            width: 80px; 
            height: 260px;
            border-radius: 40px; 
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.03), var(--glass-shadow);
            position: relative; 
            display: flex; flex-direction: column; justify-content: flex-end;
            transform: translateZ(0); /* Апаратне прискорення для Safari */
        }

        /* НОВИЙ ШАР ДЛЯ ВІДБЛИСКУ (ІЗОЛЬОВАНИЙ ВІД ФОНУ І РІДИНИ) */
        .glass-reflection {
            position: absolute;
            inset: 0;
            border-radius: 40px;
            overflow: hidden;
            pointer-events: none;
            z-index: 10;
            /* Жорстке обрізання для iOS/Safari */
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            transform: translateZ(0);
        }

        .glass-reflection::after {
            content: ''; position: absolute;
            top: -10%; left: 10%; width: 30%; height: 120%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-15deg);
        }

        /* ІКОНКА */
        .capsule-icon {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 34px; height: 34px;
            color: rgba(255, 255, 255, 0.15);
            z-index: 3;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .capsule-wrapper:hover .capsule-icon {
            color: var(--color1);
            opacity: 0.6;
            transform: translate(-50%, -50%) scale(1.15);
            filter: drop-shadow(0 0 10px var(--color1));
        }

        /* ВЕРТИКАЛЬНИЙ ВІДСОТОК */
        .capsule-percent {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            font-size: 24px; font-weight: 800;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 2px;
            pointer-events: none; z-index: 5;
            mix-blend-mode: overlay;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .capsule-wrapper:hover .capsule-percent,
        .capsule-wrapper:active .capsule-percent {
            opacity: 1;
        }

        /* ШАР ДЛЯ ОБРІЗАННЯ РІДИНИ */
        .liquid-wrapper {
            position: absolute;
            inset: 0; 
            border-radius: 40px; 
            overflow: hidden; 
            z-index: 1;
            /* Жорстке обрізання для iOS/Safari */
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            transform: translateZ(0);
        }

        /* --- ДВОКОЛІРНА РІДИНА --- */
        .liquid-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: var(--fill, 0%);
            transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: height;
        }
        .liquid-waves {
            position: absolute; top: -15px; left: 0; width: 200%; height: 16px;
            display: flex; animation: waveFlow 4s infinite linear;
            will-change: transform;
        }
        .liquid-waves svg { width: 50%; height: 100%; flex-shrink: 0; }
        
        .liquid-waves.front { color: var(--color1); opacity: 0.95; }
        
        .liquid-waves.back { 
            top: -22px; height: 24px; 
            color: var(--color2); opacity: 0.85; 
            animation: waveFlow 5.5s infinite linear reverse; 
        }
        
        .liquid-body {
            position: absolute; top: 0; left: 0; right: 0; bottom: -50px;
            background: linear-gradient(to bottom, var(--color1) 5%, var(--color2) 95%);
            opacity: 0.85;
            box-shadow: 0 -5px 30px var(--color1);
        }

        @keyframes waveFlow { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .capsule-label {
            font-size: 13px; font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s;
        }
        .capsule-wrapper:hover .capsule-label { 
            color: var(--color1);
            text-shadow: 0 0 15px var(--color1);
        }

        /* --- МОДАЛЬНЕ ВІКНО --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-glass {
            width: 90%; max-width: 500px; max-height: 85vh;
            background: rgba(15, 15, 15, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 36px;
            padding: 40px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 30px 60px rgba(0,0,0,0.9);
            transform: scale(0.95) translateY(20px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto; position: relative;
        }
        .modal-overlay.active .modal-glass { transform: scale(1) translateY(0); }
        .modal-glass::-webkit-scrollbar { width: 4px; }
        .modal-glass::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .btn-close {
            position: absolute; top: 25px; right: 25px;
            background: rgba(255, 255, 255, 0.05); border: none; color: white;
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
            font-size: 16px; transition: background 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-close:hover { background: rgba(255, 255, 255, 0.15); }

        .modal-title {
            font-size: 2rem; font-weight: 800; letter-spacing: -1px;
            margin-bottom: 30px; color: var(--current-color);
            text-shadow: 0 0 25px var(--current-color); text-align: center;
        }

        /* --- ГАЙД-МАРШРУТ (TIMELINE) --- */
        .roadmap {
            border-left: 2px solid rgba(255, 255, 255, 0.05);
            margin-left: 15px; padding-left: 25px; padding-bottom: 10px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .roadmap-item {
            position: relative; cursor: pointer;
            display: flex; align-items: center;
        }

        .roadmap-item::before {
            content: ''; position: absolute;
            left: -33px; top: 50%; transform: translateY(-50%);
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--bg-dark); border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s; z-index: 2;
        }

        .roadmap-item.completed::before {
            background: var(--current-color);
            border-color: var(--current-color);
            box-shadow: 0 0 15px var(--current-color);
        }

        .step-text {
            font-size: 1.05rem; color: rgba(255, 255, 255, 0.85);
            transition: all 0.3s; line-height: 1.4;
        }

        .roadmap-item.completed .step-text {
            color: rgba(255, 255, 255, 0.25); text-decoration: line-through;
        }

        /* Покедекс секція */
        .pokedex-box {
            background: rgba(0, 0, 0, 0.5); border-radius: 20px;
            padding: 25px; border: 1px solid rgba(255, 255, 255, 0.03); margin-top: 30px;
        }
        .pokedex-box h3 { text-align: center; margin-bottom: 15px; font-size: 1.1rem; color: rgba(255,255,255,0.6); }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .slider-val { font-weight: bold; color: var(--current-color); }
        
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1);
            border-radius: 3px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
            background: #fff; border: 2px solid var(--current-color); cursor: pointer;
            box-shadow: 0 0 15px var(--current-color); transition: transform 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        
        .dex-inputs { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        .dex-inputs input {
            background: transparent; border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; font-size: 1.2rem; padding: 8px; width: 80px; text-align: center; border-radius: 8px;
        }
        .dex-inputs input:focus { outline: none; border-color: var(--current-color); }
    </style>
</head>
<body>

    <div class="track-container" id="track-container">

    <!-- Модальне вікно -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">

              steps: ["Обсидіанові поля (Клівор)", "Багряні болота (Лілігант)", "Кобальтові береги (Арканайн)", "Нагір'я Коронет (Електрод)", "Алебастрові льоди (Авалугг)", "Храм Сінно (Діалга/Палкія)", "Перемогти Воло", "Зустріч з Аркеусом"]
            },
            { id: 'za', label: 'Z-A', title: "Legends: Z-A", color1: '#27AE60', color2: '#0B2915', dexMax: 200,

              steps: ["Сюжет Люміос-Сіті (Очікується)", "Проекти Відбудови Міста", "Зібрати Мега Камені"]
            }
        ];

        let progressData = JSON.parse(localStorage.getItem('pokeTrackerEeveeV1')) || {};
        gamesData.forEach(game => {
            if (!progressData[game.id]) progressData[game.id] = { steps: new Array(game.steps.length).fill(false), dex: 0 };
        });

        let activeId = null;

        function calcPercent(gameId) {
            const g = gamesData.find(x => x.id === gameId);
            const d = progressData[gameId];
            const completedSteps = d.steps.filter(Boolean).length;
            const stepsPct = g.steps.length === 0 ? 0 : (completedSteps / g.steps.length) * 100;
            const dexPct = (d.dex / g.dexMax) * 100;
            const overall = Math.min(100, (stepsPct * 0.9) + (dexPct * 0.1));
            return parseFloat(overall.toFixed(1));
        }

        function renderTrack() {
            const container = document.getElementById('track-container');
            container.innerHTML = '';
            
            gamesData.forEach((game, index) => {
                if (index === 9) container.innerHTML += `<div class="vertical-divider"></div>`;

                const pct = calcPercent(game.id);
                // ДОДАНО НОВИЙ ШАР .glass-reflection ДЛЯ ОБРІЗАННЯ ВІДБЛИСКУ
                container.innerHTML += `
                    <div class="capsule-wrapper" onclick="openModal('${game.id}')" style="--color1: ${game.color1};">
                        <div class="capsule">
                            <div class="glass-reflection"></div>
                            <div class="capsule-icon">${game.icon}</div>
                            <div class="capsule-percent">${pct}%</div>
                            <div class="liquid-wrapper">
                                <div class="liquid-container" style="--fill: ${pct}%; --color1: ${game.color1}; --color2: ${game.color2};">
                                    <div class="liquid-waves back">${waveSvg}</div>
                                    <div class="liquid-waves front">${waveSvg}</div>
                                    <div class="liquid-body"></div>
                                </div>
                            </div>
                        </div>
                        <span class="capsule-label">${game.label}</span>
                    </div>
                `;
            });
        }

        function openModal(id) {
            activeId = id;
            const g = gamesData.find(x => x.id === id);
            const d = progressData[id];
            
            document.documentElement.style.setProperty('--current-color', g.color1);
            document.getElementById('modalTitle').textContent = g.title;
            
            const list = document.getElementById('roadmapList');
            list.innerHTML = '';
            
            g.steps.forEach((stepText, i) => {
                const isCompleted = d.steps[i];
                const div = document.createElement('div');
                div.className = `roadmap-item ${isCompleted ? 'completed' : ''}`;
                div.onclick = () => toggleStep(i, div);
                div.innerHTML = `<span class="step-text">${stepText}</span>`;
                list.appendChild(div);
            });

            document.getElementById('dexSlider').max = g.dexMax;
            document.getElementById('dexSlider').value = d.dex;
            document.getElementById('dexInput').value = d.dex;
            document.getElementById('dexMaxInput').value = g.dexMax;
            document.getElementById('dexDisplay').textContent = `${d.dex} / ${g.dexMax}`;

            document.getElementById('modalOverlay').classList.add('active');
        }

        function toggleStep(index, element) {
            progressData[activeId].steps[index] = !progressData[activeId].steps[index];
            if (progressData[activeId].steps[index]) element.classList.add('completed');
            else element.classList.remove('completed');
            localStorage.setItem('pokeTrackerEeveeV1', JSON.stringify(progressData));
        }

        window.updateDex = function(val) {
            const max = gamesData.find(g => g.id === activeId).dexMax;
            let num = parseInt(val) || 0;
            if (num > max) num = max;
            document.getElementById('dexSlider').value = num;
            document.getElementById('dexInput').value = num;
            document.getElementById('dexDisplay').textContent = `${num} / ${max}`;
            progressData[activeId].dex = num;
            localStorage.setItem('pokeTrackerEeveeV1', JSON.stringify(progressData));
        }

        function closeModal(force = false) {
            if (force || event.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('active');
                renderTrack();
            }
        }

        renderTrack();
    </script>
</body>
</html>
